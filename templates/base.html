<!DOCTYPE html>
<html>
<head>
    <meta charset ="UTF-8">
    <title>HokieFit - {% block title %}{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0px; background: #f4f4f4; }
        header { background: maroon; color: white; padding: 12px 20px;}
        header small { color: #f5c6a5;}
        nav { padding: 10px 20px; background: white; border-bottom: 1px solid #ddd;}
        nav a { margin-right: 12px; color: maroon;}
        nav a.current { font-weight: bold; }
        main { padding: 20px; }
        .box { background: white; border: 1px solid #ddd; border-radius: 6px; padding: 14px; margin-bottom: 16px; }
        .ok { background: #d9f2e3; color: #1f6b42; padding: 10px; border-radius: 6px; margin-bottom: 12px; }
        .error { background: #fbe0de; color: #a52a1f; padding: 10px; border-radius: 6px; margin-bottom: 12px; }
        form.insert label { display: inline-block; margin: 0 12px 10px 0; font-size: 13px; }
        form.insert input, form.insert select { display: block; padding: 5px; margin-top: 3px; min-width: 170px; }
        button { background: #861f41; color: white; border: 0; padding: 7px 14px; border-radius: 4px; cursor: pointer; }
        button.delete { background: #c0392b; padding: 4px 10px; }
        table { border-collapse: collapse; width: 100%; background: white; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 6px; text-align: left; max-width: 220px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        th { background: #eee; }
        html, body { height: auto; overflow: auto; }
        .rows-box { max-height: 70vh; overflow: auto; border: 1px solid #ddd; background: white; }
        .rows-box th { position: sticky; top: 0; background: #eee; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <header>
        <b>HokieFit</b> &nbsp; <small>Connected to PostgreSQL {{ version }} (Supabase)</small>
    </header>

    <nav>
        <a href="{{ url_for('show_locations') }}" class="{{ 'current' if request.endpoint == 'show_locations' }}">Location</a>
        <a href="{{ url_for('show_table', name='gym_user') }}" class="{{ 'current' if request.endpoint == 'show_table' }}">Tables</a>
    </nav>

    {% block subnav %}{% endblock %}

    <main>
        {% for category, message in get_flashed_messages(with_categories=true) %}
            <div class="{{ category }}">{{ message }}</div>
        {% endfor %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
