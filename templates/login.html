{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block head %}
<style>
    .login { max-width: 320px; margin: 40px auto; }
    .login h2 { margin-top: 0; }
    .login label { display: block; margin-bottom: 12px; font-size: 13px; }
    .login input { display: block; width: 100%; box-sizing: border-box; padding: 7px; margin-top: 3px; }
    .login button { width: 100%; }
</style>
{% endblock %}

{% block content %}
<div class="box login">
    <h2>Log in</h2>
    <form method="post" action="{{ url_for('login') }}">
        <label>
            Email
            <input type="email" name="email" value="{{ email or '' }}" autocomplete="username" required autofocus>
        </label>
        <label>
            Password
            <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Log in</button>
    </form>
